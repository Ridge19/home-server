services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: host
    environment:
      TZ: 'Australia/Melbourne'
      ServerIP: '192.168.4.201'
      VIRTUAL_HOST: 'pihole.nas'
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80"
    volumes:
      - ./etc-pihole/:/etc/pihole/
      - ./etc-dnsmasq.d/:/etc/dnsmasq.d/
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    ports:
      - "8080:8080"
    volumes:
      - /home/Docker/openwebui:/app/data

  nagios:
    image: jasonrivers/nagios:latest
    ports:
      - "8081:80"
    volumes:
      - ./nagios_config:/opt/nagios/etc

  portainer:
    image: cr.portainer.io/portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
      # - "8000:8000"  # Optional: Portainer Edge agent tunnel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    volumes:
      - minecraftdata:/data
      - /home/Minecraft/plugins:/plugins
    ports:
      - "30000:30000"
    environment:
      EULA: "TRUE"
      TYPE: "BUKKIT"
      OPS: ""
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
    tty: true
    stdin_open: true
    restart: unless-stopped

  samba:
    image: dperson/samba
    volumes:
      - samba:/mount
    ports:
      - '1139:139'
      - '1445:445'
    command: '-s "samba;/mount/;yes;no;no;all;none"'
    networks:
      - default
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    volumes:
      - /media/ridge/Seagate1TB:/srv/Seagate1TB
      - /media/ridge/KESU:/srv/KESU
    ports:
      - "8082:80"
    restart: unless-stopped
    command: -r /srv

  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    ports:
      - "8085:8080"   # Dashy will be accessible at http://192.168.4.201:8085
    volumes:
      - ./data:/app/public/conf   # Persistent configuration storage

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8090:80"  # Host port 8090 → container port 80
    volumes:
      - /home/Docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro

  nginxproxymanager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginxproxymanager
    restart: unless-stopped
    ports:
      - "8088:80"     # Web traffic
      - "8181:81"     # Admin UI
      - "4443:443"    # SSL traffic
    volumes:
      - /home/Docker/nginx-proxy-manager/data:/data
      - /home/Docker/nginx-proxy-manager/letsencrypt:/etc/letsencrypt

volumes:
  portainer_data:
  minecraftdata:
    external: true
  samba:
    external: true
